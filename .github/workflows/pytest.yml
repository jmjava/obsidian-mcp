name: ci

on:
  pull_request:
  push:
    branches: [main]

# Overlapping pushes (and PR updates) on the same ref cancel the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python scripts/ruff_baseline_gate.py

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean as you code
        run: python scripts/complexity_diff_gate.py --base origin/main

  hotspot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hotspot
        run: python scripts/hotspot_gate.py --base origin/main

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mutation
        run: python scripts/mutation_gate.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q --tb=short

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Missing vault directory fails closed
        env:
          SMOKE_SKIP_PYTEST: "1"
        run: |
          set -euo pipefail
          expect_fail() {
            local status=0
            "$@" || status=$?
            if [[ "$status" -eq 0 ]]; then
              echo "smoke-test.sh passed with a missing vault; expected a failure" >&2
              exit 1
            fi
          }
          expect_fail env OBSIDIAN_VAULT_PATH="/tmp/obsidian-smoke-missing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ./scripts/smoke-test.sh
      - name: Unset vault path uses a temporary fixture
        env:
          SMOKE_SKIP_PYTEST: "1"
        run: env -u OBSIDIAN_VAULT_PATH ./scripts/smoke-test.sh
      - name: Smoke test against a temporary fixture vault
        env:
          SMOKE_SKIP_PYTEST: "1"
        run: |
          set -euo pipefail
          unset OBSIDIAN_VAULT_PATH
          fixture="$(mktemp -d /tmp/obsidian-smoke-fixture.XXXXXX)"
          case "$fixture" in
            "$HOME"|"$HOME"/*)
              echo "refusing to point smoke CI at a home vault: $fixture" >&2
              exit 1
              ;;
          esac
          if [[ ! -d "$fixture" ]]; then
            echo "fixture vault was not created: $fixture" >&2
            exit 1
          fi
          printf '%s\n' 'CI fixture vault. Not an operator vault.' > "$fixture/README.md"
          export OBSIDIAN_VAULT_PATH="$fixture"
          ./scripts/smoke-test.sh
