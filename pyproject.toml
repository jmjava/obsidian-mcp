[project]
name = "obsidian-dev-memory"
version = "0.1.0"
description = "Local MCP server that stores AI coding-assistant memory as Markdown in an Obsidian vault."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "John Menke" }]
keywords = ["mcp", "obsidian", "cursor", "copilot", "claude", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mutmut==3.8.0",
]

[project.scripts]
obsidian-dev-memory = "obsidian_dev_memory.server:main"

[project.urls]
Repository = "https://github.com/jmjava/obsidian-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_dev_memory"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mutmut==3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mutmut]
source_paths = ["src/obsidian_dev_memory"]
only_mutate = ["*markdown.py"]
pytest_add_cli_args_test_selection = ["tests/test_markdown.py"]
use_git_change_detection = false
